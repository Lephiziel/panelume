name: Publish Panelume 0.2.9 APK
on:
  push:
    branches:
      - release/panelume-0.2.9
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panelume-0.2.9-ci-apk
          path: out
          github-token: ${{ github.token }}
          run-id: 45734123514
      - name: Reconstruct privately signed APK and verify checksum
        run: |
          set -euo pipefail
          echo "d842f4f0f0437335681a98ffb00a5210f71ada75f29b9e936b90cb8f953d8f03  out/Panelume-0.2.9.apk" | sha256sum -c
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          encoded = Path(".github/release/0.2.9-signature.patch.zlib.b64").read_text().strip()
          Path("/tmp/panelume-029.patch").write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          cp out/Panelume-0.2.9.apk app.apk
          git apply --binary /tmp/panelume-029.patch
          echo "1fcddfc311a6c0febb78b2fd081dca0991064a1138e9219e549bf8031e78a7db  app.apk" | sha256sum -c
          mv -f app.apk out/Panelume-0.2.9.apk
      - name: Verify original certificate and Android package identity
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          "$tools/apksigner" verify --verbose --print-certs out/Panelume-0.2.9.apk | tee /tmp/apksigner-check.txt
          grep -F "Signer #1 certificate SHA-256 digest: e71850cc090b48c0f70c9af1aeb0f8a123c128b423aa008fd46861337f1cfec9" /tmp/apksigner-check.txt
          "$tools/aapt2" dump badging out/Panelume-0.2.9.apk | tee /tmp/panelume-badging.txt
          grep -E "^package: name='dev.panelume.reader.next' versionCode='11' versionName='0.2.9'" /tmp/panelume-badging.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.9 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          cp out/Panelume-0.2.9.apk out/Panelume.apk
          (cd out && sha256sum Panelume-0.2.9.apk Panelume.apk > SHA256SUMS.txt)
          gh release create v0.2.9 out/Panelume-0.2.9.apk out/Panelume.apk out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target 4dfc1aeff127f037847be3e34d550c31c0c3a84b \
            --title "Panelume 0.2.9 — Offline storage overview" \
            --notes "Adds read-only offline chapter size and missing/empty archive counts, grouped by series. No files are deleted. Thirteen regression tests passed. Same application ID, signing certificate and data schema. Install over 0.2.8 without uninstalling. Physical-device checks remain open."
