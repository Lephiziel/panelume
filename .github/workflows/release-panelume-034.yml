name: Publish Panelume 0.3.4 APK
on:
  push:
    branches:
      - release/panelume-0.3.4
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panelume-0.3.4-ci-apk
          path: out
          github-token: ${{ github.token }}
          run-id: 45976917028
      - name: Reconstruct privately signed APK and verify checksum
        run: |
          set -euo pipefail
          echo "46dbd215f2b4b94e981775673c88d03ff4c814807af5ae6ff8735e09d14fff4c  out/Panelume-0.3.4.apk" | sha256sum -c
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          encoded = Path(".github/release/0.3.4-signature.patch.zlib.b64").read_text().strip()
          Path("/tmp/panelume-034.patch").write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          cp out/Panelume-0.3.4.apk app.apk
          git apply --binary /tmp/panelume-034.patch
          echo "9898cd9a678c853360b781eb64d9504e24c59348d29657bd435480b43645b20a  app.apk" | sha256sum -c
          mv -f app.apk out/Panelume-0.3.4.apk
      - name: Verify original certificate and Android package identity
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          "$tools/apksigner" verify --verbose --print-certs out/Panelume-0.3.4.apk | tee /tmp/apksigner-check.txt
          grep -F "Signer #1 certificate SHA-256 digest: e71850cc090b48c0f70c9af1aeb0f8a123c128b423aa008fd46861337f1cfec9" /tmp/apksigner-check.txt
          "$tools/aapt2" dump badging out/Panelume-0.3.4.apk | tee /tmp/panelume-badging.txt
          grep -E "^package: name='dev.panelume.reader.next' versionCode='20' versionName='0.3.4'" /tmp/panelume-badging.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.4 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          cp out/Panelume-0.3.4.apk out/Panelume.apk
          (cd out && sha256sum Panelume-0.3.4.apk Panelume.apk > SHA256SUMS.txt)
          gh release create v0.3.4 out/Panelume-0.3.4.apk out/Panelume.apk out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target 251f60ac9dc7acf34a1f14d489bee67b8070a9e4 \
            --prerelease --latest=false \
            --title "Panelume 0.3.4 — Next chapter preparation (preview)" \
            --notes "Adds optional preparation of one following catalogue chapter after 75% of contiguous reading. The feature is off by default, uses the existing series-download network policy, and queues work only when the download queue is idle. Existing chapters and failed or intentionally evicted downloads are not duplicated or retried. The end card offers direct navigation to a saved successor or opens the catalogue when needed. Forty-three automated regression tests passed. Original signing certificate, application ID and library database schema are preserved. Physical-device network and navigation measurements remain outstanding. Latest stable remains 0.2.9."
