name: Publish Panelume 0.2.7 APK
on:
  push:
    branches:
      - release/panelume-0.2.7
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panelume-0.2.7-ci-apk
          path: out
          github-token: ${{ github.token }}
          run-id: 45611256482
      - name: Reconstruct privately signed APK and verify checksum
        run: |
          set -euo pipefail
          echo "6055eded58f21c5d1df64f0025a36b02121569accde4760ee46ada5686d4adfd  out/Panelume-0.2.7.apk" | sha256sum -c
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          encoded = Path(".github/release/0.2.7-signature.patch.zlib.b64").read_text().strip()
          Path("/tmp/panelume-027.patch").write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          cp out/Panelume-0.2.7.apk app.apk
          git apply --binary /tmp/panelume-027.patch
          echo "843dd1d0a49982e242b5f3f73355c0f1b2d4907232e415e2fd26e8201854e8eb  app.apk" | sha256sum -c
          mv -f app.apk out/Panelume-0.2.7.apk
      - name: Verify original certificate and Android package identity
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          "$tools/apksigner" verify --verbose --print-certs out/Panelume-0.2.7.apk | tee /tmp/apksigner-check.txt
          grep -F "Signer #1 certificate SHA-256 digest: e71850cc090b48c0f70c9af1aeb0f8a123c128b423aa008fd46861337f1cfec9" /tmp/apksigner-check.txt
          "$tools/aapt2" dump badging out/Panelume-0.2.7.apk | tee /tmp/panelume-badging.txt
          grep -E "^package: name='dev.panelume.reader.next' versionCode='9' versionName='0.2.7'" /tmp/panelume-badging.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.7 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          cp out/Panelume-0.2.7.apk out/Panelume.apk
          (cd out && sha256sum Panelume-0.2.7.apk Panelume.apk > SHA256SUMS.txt)
          gh release create v0.2.7 out/Panelume-0.2.7.apk out/Panelume.apk out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target f2ab2ea94b4e579931c58ce843dd2c7acfe488eb \
            --title "Panelume 0.2.7 — Reliability and progress export" \
            --notes "Adds local first-panel timing, JSON metadata export and regression tests for eight catalogues, queue recovery, bookmarks and export. Install over 0.2.6 without uninstalling. Original signing certificate, application ID and DB schema are unchanged. JSON export does not include chapter files; import is not yet supported. Device upgrade and live catalogue checks remain outstanding. Panelume.apk is the stable download filename."
