name: Publish Panelume 0.2.6 APK
on:
  push:
    branches:
      - release/panelume-0.2.6
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panelume-0.2.6-ci-apk
          path: out
          github-token: ${{ github.token }}
          run-id: 45557913634
      - name: Reconstruct privately signed APK and verify checksum
        run: |
          set -euo pipefail
          echo "1c5d7969d36a134e4a02730d924e6fb2e63e46c40056460f9428ea394b882f76  out/Panelume-0.2.6.apk" | sha256sum -c
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          encoded = Path(".github/release/0.2.6-signature.patch.zlib.b64").read_text().strip()
          Path("/tmp/panelume-026.patch").write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          cp out/Panelume-0.2.6.apk app.apk
          git apply --binary /tmp/panelume-026.patch
          echo "6a7630d3d73b684a083f756b9c374fbf43c60d33a2f0a885b8a9a73cf55cb5d6  app.apk" | sha256sum -c
          mv -f app.apk out/Panelume-0.2.6.apk
      - name: Verify original certificate and Android package identity
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          "$tools/apksigner" verify --verbose --print-certs out/Panelume-0.2.6.apk | tee /tmp/apksigner-check.txt
          grep -F "Signer #1 certificate SHA-256 digest: e71850cc090b48c0f70c9af1aeb0f8a123c128b423aa008fd46861337f1cfec9" /tmp/apksigner-check.txt
          "$tools/aapt2" dump badging out/Panelume-0.2.6.apk | tee /tmp/panelume-badging.txt
          grep -E "^package: name='dev.panelume.reader.next' versionCode='8' versionName='0.2.6'" /tmp/panelume-badging.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.6 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          cp out/Panelume-0.2.6.apk out/Panelume.apk
          (cd out && sha256sum Panelume-0.2.6.apk Panelume.apk > SHA256SUMS.txt)
          gh release create v0.2.6 out/Panelume-0.2.6.apk out/Panelume.apk out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target c97d0045203ee197161ea69f1e51b6e88de4fcca \
            --title "Panelume 0.2.6 — Stable zoom and easier first chapter" \
            --notes "Fixes zoom cache invalidation and adds separate detail tiles, empty-library search/import, remembered search, known-title aliases, partial catalogue failure recovery and chapter preparation controls. Install over 0.2.5 without uninstalling; the original signing certificate, application ID and data schema are unchanged. CI passed tile geometry and search alias checks. Real-device gesture, upgrade and catalogue tests remain outstanding. Panelume.apk is the stable download filename."
