name: Android build
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null)
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Test zoom tile geometry
        run: bash tools/test-zoom-tiles.sh
      - name: Build and verify APK
        run: ./tools/build-apk.sh
      - name: Upload APK for release signing
        uses: actions/upload-artifact@v4
        with:
          name: panelume-0.2.6-ci-apk
          path: out/Panelume-0.2.6.apk
          if-no-files-found: error
          retention-days: 7
