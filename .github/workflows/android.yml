name: Android build
on: [push, pull_request]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null)
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Test zoom tile geometry
        run: bash tools/test-zoom-tiles.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test catalogue fixtures, queue recovery and progress export
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload regression test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panelume-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Build and verify APK
        run: ./tools/build-apk.sh
      - name: Upload APK for release signing
        uses: actions/upload-artifact@v4
        with:
          name: panelume-0.3.2-ci-apk
          path: out/Panelume-0.3.2.apk
          if-no-files-found: error
          retention-days: 7
