name: Publish Panelume 0.2.11 APK
on:
  push:
    branches:
      - release/panelume-0.2.11
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panelume-0.2.11-ci-apk
          path: out
          github-token: ${{ github.token }}
          run-id: 45861769698
      - name: Reconstruct privately signed APK and verify checksum
        run: |
          set -euo pipefail
          echo "c40499ef546deab3042997b0e4ac4cac7eecf8d8848b1903a12577de74d00c83  out/Panelume-0.2.11.apk" | sha256sum -c
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          encoded = Path(".github/release/0.2.11-signature.patch.zlib.b64").read_text().strip()
          Path("/tmp/panelume-0211.patch").write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          cp out/Panelume-0.2.11.apk app.apk
          git apply --binary /tmp/panelume-0211.patch
          echo "44eb83c4d11a68fef3fb7cca758c6b9aa3a0dde2c02dabfcc305593f7543e72a  app.apk" | sha256sum -c
          mv -f app.apk out/Panelume-0.2.11.apk
      - name: Verify original certificate and Android package identity
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          "$tools/apksigner" verify --verbose --print-certs out/Panelume-0.2.11.apk | tee /tmp/apksigner-check.txt
          grep -F "Signer #1 certificate SHA-256 digest: e71850cc090b48c0f70c9af1aeb0f8a123c128b423aa008fd46861337f1cfec9" /tmp/apksigner-check.txt
          "$tools/aapt2" dump badging out/Panelume-0.2.11.apk | tee /tmp/panelume-badging.txt
          grep -E "^package: name='dev.panelume.reader.next' versionCode='13' versionName='0.2.11'" /tmp/panelume-badging.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.11 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          cp out/Panelume-0.2.11.apk out/Panelume.apk
          (cd out && sha256sum Panelume-0.2.11.apk Panelume.apk > SHA256SUMS.txt)
          gh release create v0.2.11 out/Panelume-0.2.11.apk out/Panelume.apk out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target 4571dba5dbb1541c35c7c28a3d722b7723e53e4f \
            --prerelease --latest=false \
            --title "Panelume 0.2.11 — Optional settings transfer (preview)" \
            --notes "Adds opt-in language, download network policy and last search restoration from existing library ZIPs. All choices off by default. Applies selected settings only after successful library restore. Twenty regression tests passed; original certificate and app ID preserved. Physical-device restoration remains unverified. Latest stable remains 0.2.9. Do not uninstall a current library to test this release; Android does not allow an ordinary in-place downgrade from versionCode 13."
