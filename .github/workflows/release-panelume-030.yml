name: Publish Panelume 0.3.0 APK
on:
  push:
    branches:
      - release/panelume-0.3.0
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panelume-0.3.0-ci-apk
          path: out
          github-token: ${{ github.token }}
          run-id: 45868198077
      - name: Reconstruct privately signed APK and verify checksum
        run: |
          set -euo pipefail
          echo "4e5afba6e8906136b6ab5f0e52022d90e6da48a0578d76c1160e52460049337b  out/Panelume-0.3.0.apk" | sha256sum -c
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          encoded = Path(".github/release/0.3.0-signature.patch.zlib.b64").read_text().strip()
          Path("/tmp/panelume-030.patch").write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          cp out/Panelume-0.3.0.apk app.apk
          git apply --binary /tmp/panelume-030.patch
          echo "a1126955d873b3e924bd3c026424b027d23bc8c6f870c1617438c0919d24c781  app.apk" | sha256sum -c
          mv -f app.apk out/Panelume-0.3.0.apk
      - name: Verify original certificate and Android package identity
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          "$tools/apksigner" verify --verbose --print-certs out/Panelume-0.3.0.apk | tee /tmp/apksigner-check.txt
          grep -F "Signer #1 certificate SHA-256 digest: e71850cc090b48c0f70c9af1aeb0f8a123c128b423aa008fd46861337f1cfec9" /tmp/apksigner-check.txt
          "$tools/aapt2" dump badging out/Panelume-0.3.0.apk | tee /tmp/panelume-badging.txt
          grep -E "^package: name='dev.panelume.reader.next' versionCode='16' versionName='0.3.0'" /tmp/panelume-badging.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          cp out/Panelume-0.3.0.apk out/Panelume.apk
          (cd out && sha256sum Panelume-0.3.0.apk Panelume.apk > SHA256SUMS.txt)
          gh release create v0.3.0 out/Panelume-0.3.0.apk out/Panelume.apk out/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target 2b3e16225928f6e2cca1b72e0bc7168faebe21cc \
            --prerelease --latest=false \
            --title "Panelume 0.3.0 — Opening performance (preview)" \
            --notes "Hashes online CBZ archives during writing instead of rereading the entire file. Preserves archive inspection, size checks and durable sync. Adds local median, latest and count for successful first-panel latency by opening type. Twenty-nine regression tests passed. Real-device speedup and recovery remain unverified; streaming is not implemented. Original certificate, app ID and database schema preserved. Latest stable remains 0.2.9. Do not uninstall a current library to test this release; Android does not allow an ordinary in-place downgrade from versionCode 16."
