plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.panelume.reader'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.panelume.reader.next'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.2.6'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
